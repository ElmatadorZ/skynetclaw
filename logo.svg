<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#0c1828"/>
      <stop offset="100%" stop-color="#010508"/>
    </radialGradient>
    <radialGradient id="eyeIris" cx="38%" cy="33%" r="62%">
      <stop offset="0%"   stop-color="#a0f8ff"/>
      <stop offset="30%"  stop-color="#00c8f0"/>
      <stop offset="70%"  stop-color="#0068b8"/>
      <stop offset="100%" stop-color="#001840"/>
    </radialGradient>
    <radialGradient id="triGlow" cx="50%" cy="55%" r="58%">
      <stop offset="0%"   stop-color="#00c0f0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#003080" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00e8ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0080c0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circ">
      <circle cx="60" cy="60" r="57"/>
    </clipPath>
    <clipPath id="eyeClip">
      <path d="M 36,56 Q 60,36 84,56 Q 60,76 36,56 Z"/>
    </clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="eyesoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="60" cy="60" r="60" fill="#010408"/>
  <circle cx="60" cy="60" r="58" fill="url(#bg)"/>

  <!-- Triangle fill glow -->
  <polygon points="60,7 103.3,82 16.7,82" fill="url(#triGlow)" clip-path="url(#circ)"/>

  <!-- Tick marks along triangle edges -->
  <g stroke="#00d0ff" stroke-linecap="round" clip-path="url(#circ)" filter="url(#glow)">
    <g stroke-width="1.1" opacity="0.8">
      <line x1="61.35" y1="9.34"  x2="68.04" y2="5.48"/>
      <line x1="64.06" y1="14.03" x2="68.44" y2="11.50"/>
      <line x1="66.77" y1="18.72" x2="74.21" y2="14.42"/>
      <line x1="69.47" y1="23.41" x2="74.32" y2="20.61"/>
      <line x1="72.18" y1="28.09" x2="80.38" y2="23.36"/>
      <line x1="74.88" y1="32.78" x2="80.20" y2="29.71"/>
      <line x1="77.59" y1="37.47" x2="86.55" y2="32.30"/>
      <line x1="80.30" y1="42.16" x2="86.09" y2="38.81"/>
      <line x1="83.00" y1="46.84" x2="92.34" y2="41.45"/>
      <line x1="85.71" y1="51.53" x2="91.26" y2="48.32"/>
      <line x1="88.42" y1="56.22" x2="97.00" y2="51.27"/>
      <line x1="91.12" y1="60.91" x2="96.21" y2="57.97"/>
      <line x1="93.83" y1="65.59" x2="101.65" y2="61.08"/>
      <line x1="96.54" y1="70.28" x2="101.15" y2="67.62"/>
      <line x1="99.24" y1="74.97" x2="106.31" y2="70.89"/>
      <line x1="101.95" y1="79.66" x2="106.09" y2="77.26"/>
      <line x1="101.14" y1="82"    x2="101.14" y2="89.68"/>
      <line x1="96.81"  y1="82"    x2="96.81"  y2="86.98"/>
      <line x1="92.48"  y1="82"    x2="92.48"  y2="90.38"/>
      <line x1="88.15"  y1="82"    x2="88.15"  y2="87.41"/>
      <line x1="83.82"  y1="82"    x2="83.82"  y2="91.08"/>
      <line x1="79.49"  y1="82"    x2="79.49"  y2="87.84"/>
      <line x1="75.16"  y1="82"    x2="75.16"  y2="91.78"/>
      <line x1="70.83"  y1="82"    x2="70.83"  y2="88.28"/>
      <line x1="66.50"  y1="82"    x2="66.50"  y2="92.48"/>
      <line x1="62.17"  y1="82"    x2="62.17"  y2="88.71"/>
      <line x1="57.83"  y1="82"    x2="57.83"  y2="92.83"/>
      <line x1="53.50"  y1="82"    x2="53.50"  y2="88.49"/>
      <line x1="49.17"  y1="82"    x2="49.17"  y2="92.12"/>
      <line x1="44.84"  y1="82"    x2="44.84"  y2="88.06"/>
      <line x1="40.51"  y1="82"    x2="40.51"  y2="91.42"/>
      <line x1="36.18"  y1="82"    x2="36.18"  y2="87.63"/>
      <line x1="31.85"  y1="82"    x2="31.85"  y2="90.72"/>
      <line x1="27.52"  y1="82"    x2="27.52"  y2="87.19"/>
      <line x1="23.19"  y1="82"    x2="23.19"  y2="90.02"/>
      <line x1="18.86"  y1="82"    x2="18.86"  y2="86.76"/>
      <line x1="18.05"  y1="79.66" x2="11.37"  y2="75.80"/>
      <line x1="20.76"  y1="74.97" x2="16.38"  y2="72.44"/>
      <line x1="23.46"  y1="70.28" x2="16.02"  y2="65.98"/>
      <line x1="26.17"  y1="65.59" x2="21.32"  y2="62.79"/>
      <line x1="28.88"  y1="60.91" x2="20.68"  y2="56.17"/>
      <line x1="31.58"  y1="56.22" x2="26.26"  y2="53.15"/>
      <line x1="34.29"  y1="51.53" x2="25.33"  y2="46.36"/>
      <line x1="37.00"  y1="46.84" x2="31.21"  y2="43.50"/>
      <line x1="39.70"  y1="42.16" x2="30.37"  y2="36.77"/>
      <line x1="42.41"  y1="37.47" x2="36.85"  y2="34.26"/>
      <line x1="45.12"  y1="32.78" x2="36.54"  y2="27.83"/>
      <line x1="47.82"  y1="28.09" x2="42.74"  y2="25.16"/>
      <line x1="50.53"  y1="23.41" x2="42.71"  y2="18.89"/>
      <line x1="53.23"  y1="18.72" x2="48.62"  y2="16.05"/>
      <line x1="55.94"  y1="14.03" x2="48.88"  y2="9.95"/>
      <line x1="58.65"  y1="9.34"  x2="54.50"  y2="6.95"/>
    </g>
  </g>

  <!-- Outer triangle border -->
  <polygon points="60,7 103.3,82 16.7,82"
    fill="none" stroke="#00c8f0" stroke-width="3.2" stroke-linejoin="round"
    clip-path="url(#circ)" filter="url(#glow)"/>

  <!-- Inner triangle (subtle) -->
  <polygon points="60,17 94.64,77 25.36,77"
    fill="none" stroke="#00a8e0" stroke-width="1.2" stroke-linejoin="round"
    clip-path="url(#circ)" opacity="0.55"/>

  <!-- ═══ EYE OF PROVIDENCE — ENLARGED ═══ -->

  <!-- Outer eye ambient glow -->
  <ellipse cx="60" cy="56" rx="20" ry="12" fill="url(#eyeGlow)" filter="url(#eyesoft)" opacity="0.9"/>

  <!-- Eyelid shape (mandorla) — wide & prominent -->
  <path d="M 36,56 Q 60,36 84,56 Q 60,76 36,56 Z"
    fill="#00060f" stroke="#00d8ff" stroke-width="1.8" filter="url(#glow)"/>

  <!-- Iris outer ring -->
  <circle cx="60" cy="56" r="14.5"
    fill="#001428" stroke="#00d0f8" stroke-width="1.5"
    clip-path="url(#eyeClip)" filter="url(#glow)"/>

  <!-- Iris fill -->
  <circle cx="60" cy="56" r="13.5"
    fill="url(#eyeIris)" clip-path="url(#eyeClip)"/>

  <!-- Iris texture rings -->
  <circle cx="60" cy="56" r="11.5"
    fill="none" stroke="#40e8ff" stroke-width="0.5" opacity="0.45"
    clip-path="url(#eyeClip)"/>
  <circle cx="60" cy="56" r="9"
    fill="none" stroke="#20d0f0" stroke-width="0.4" opacity="0.3"
    clip-path="url(#eyeClip)"/>

  <!-- Iris rays (8 spokes) -->
  <g stroke="#60f0ff" stroke-width="0.5" opacity="0.4" clip-path="url(#eyeClip)">
    <line x1="60" y1="43.5" x2="60" y2="49"/>
    <line x1="60" y1="63" x2="60" y2="68.5"/>
    <line x1="47.5" y1="56" x2="52" y2="56"/>
    <line x1="68" y1="56" x2="73.5" y2="56"/>
    <line x1="50.8" y1="46.8" x2="54.6" y2="50.6"/>
    <line x1="65.4" y1="61.4" x2="69.2" y2="65.2"/>
    <line x1="69.2" y1="46.8" x2="65.4" y2="50.6"/>
    <line x1="54.6" y1="61.4" x2="50.8" y2="65.2"/>
  </g>

  <!-- Pupil -->
  <circle cx="60" cy="56" r="6.2"
    fill="#000814" clip-path="url(#eyeClip)"/>

  <!-- Pupil inner dark -->
  <circle cx="60" cy="56" r="5"
    fill="#000208" clip-path="url(#eyeClip)"/>

  <!-- Pupil rim glow -->
  <circle cx="60" cy="56" r="6.2"
    fill="none" stroke="#00c8f0" stroke-width="0.8" opacity="0.8"
    filter="url(#glow)" clip-path="url(#eyeClip)"/>

  <!-- Iris–pupil transition ring -->
  <circle cx="60" cy="56" r="7.2"
    fill="none" stroke="#0090d8" stroke-width="0.6" opacity="0.5"
    clip-path="url(#eyeClip)"/>

  <!-- Catchlight / highlight -->
  <ellipse cx="56.5" cy="52.2" rx="2.8" ry="1.8"
    fill="rgba(210,255,255,0.65)" transform="rotate(-25,56.5,52.2)"
    clip-path="url(#eyeClip)"/>
  <!-- Small secondary highlight -->
  <circle cx="63.5" cy="58.5" r="0.9"
    fill="rgba(180,240,255,0.45)" clip-path="url(#eyeClip)"/>

  <!-- Eyelid border redraw on top -->
  <path d="M 36,56 Q 60,36 84,56 Q 60,76 36,56 Z"
    fill="none" stroke="#00e0ff" stroke-width="1.8" filter="url(#glow)"/>

  <!-- Eyelid corner accents -->
  <circle cx="36" cy="56" r="1.4" fill="#00d0ff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="84" cy="56" r="1.4" fill="#00d0ff" opacity="0.9" filter="url(#glow)"/>

  <!-- Frame rings -->
  <circle cx="60" cy="60" r="57" fill="none" stroke="#001020" stroke-width="3"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="rgba(0,160,230,0.22)" stroke-width="1"/>
</svg>

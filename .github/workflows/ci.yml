name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    # The claim this repository has to earn is that it works on a machine that
    # is not the author's. Every step below is deliberately small, so a failure
    # names itself instead of hiding inside a compound script.
    name: install + boot · ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Environment
        shell: bash
        run: |
          python --version
          pip --version
          echo "runner=${{ runner.os }}  cwd=$(pwd)"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Installed packages
        shell: bash
        run: pip list

      - name: Seed config from templates
        shell: bash
        run: |
          cp backend/settings.example.json backend/settings.json
          cp .env.example .env
          echo "config seeded"

      - name: Migrate the database
        shell: bash
        working-directory: backend
        run: python migrate.py up

      - name: Import the application
        shell: bash
        working-directory: backend
        run: python -c "import main; print('routes:', len(main.app.routes))"

      - name: Start the server
        shell: bash
        working-directory: backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8766 --log-level info > server.log 2>&1 &
          for i in $(seq 1 45); do
            sleep 2
            if curl -sf --max-time 5 http://127.0.0.1:8766/api/system/health/quick >/dev/null 2>&1; then
              echo "server responded after $((i * 2))s"
              exit 0
            fi
          done
          echo "server did not respond within 90s"
          echo "--- server.log ---"
          cat server.log
          exit 1

      - name: Probe health
        # A runner has no model runtime, so YELLOW is the correct verdict here:
        # the House is up and honest about what it cannot reach. Only RED — a
        # fault in the House itself — fails the build.
        shell: bash
        working-directory: backend
        run: |
          curl -sf --max-time 30 http://127.0.0.1:8766/api/system/health -o health.json
          python - <<'PY'
          import json, sys
          h = json.load(open("health.json", encoding="utf-8"))
          print(f"ok={h.get('ok')}  status={h.get('status')}  {h.get('summary')}")
          red = []
          for c in h.get("checks", []):
              print(f"  {str(c.get('status')):6} {c.get('name')}: {str(c.get('msg'))[:100]}")
              if c.get("status") == "RED":
                  red.append(c.get("name"))
          if red:
              sys.exit("RED checks on a clean machine: " + ", ".join(map(str, red)))
          PY

      - name: Server log (always)
        if: always()
        shell: bash
        working-directory: backend
        run: tail -60 server.log || echo "(no server.log)"

  tests:
    name: test suite · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: pip install -r backend/requirements.txt
      - name: Seed config
        shell: bash
        run: cp backend/settings.example.json backend/settings.json
      - name: pytest
        shell: bash
        working-directory: backend
        run: |
          python migrate.py up
          python -m pytest -q

  privacy:
    # A public release assembled from a private instance must prove, on every
    # push, that nothing personal has crept back in.
    name: no personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for operator-private material
        shell: bash
        run: python tools/privacy_scan.py

  docker:
    # The compose route is the one most first-time users take, so the image has
    # to be proven to build rather than assumed to.
    name: docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t skynetclaw:ci .

      - name: Run and probe
        run: |
          docker run -d --name sc -p 8766:8766 skynetclaw:ci
          for i in $(seq 1 45); do
            sleep 3
            if curl -sf --max-time 5 http://127.0.0.1:8766/api/system/health/quick >/dev/null 2>&1; then
              echo "container healthy after $((i * 3))s"
              break
            fi
          done
          curl -sf --max-time 20 http://127.0.0.1:8766/api/system/health/quick
          echo

      - name: Container log (always)
        if: always()
        run: docker logs sc 2>&1 | tail -60 || true
